[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-gtsh"
version = "1.0.0"
description = "Bi-view Continual Graph-Transferred Semantic Hashing"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Xing Tian"},
  {name = "Yang Lei"},
  {name = "Haowen Liang"},
  {name = "Wen Li"},
  {name = "Ziying Tan"},
  {name = "Wing W. Y. Ng"},
  {name = "Marcello Pelillo"},
]
dependencies = [
  "h5py>=3.10,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4", "Pillow>=10,<12"]
dev = ["build>=1.2", "pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
bc-gtsh = "cmr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
